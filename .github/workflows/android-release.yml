
name: Android Build & Release

on:
  push:
    branches:
      - master

  # Allow manual execution
  workflow_dispatch:

# Allow GitHub Actions to create releases
permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v6

      # 2. Setup Java
      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 3. Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # 4. Grant execution permission
      - name: Grant Execute Permission
        run: chmod +x ./gradlew

      # 5. Build APK
      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug

      # 6. Prepare APK
      - name: Prepare APK
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug \
            -maxdepth 1 -name "*.apk" -print -quit)

          if [ -z "$APK_PATH" ]; then
            echo "APK file not found!"
            exit 1
          fi

          cp "$APK_PATH" CloudStream-debug.apk

      # 7. Create GitHub Release
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"

          gh release create "$TAG" CloudStream-debug.apk \
            --target "$GITHUB_SHA" \
            --title "CloudStream Build #${GITHUB_RUN_NUMBER}" \
            --notes "Automated build from commit ${GITHUB_SHA}" \
            --prerelease
